<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – DoubtIt</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 16px; }
    .login-box  { width:100%; max-width:400px; }
  </style>
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="nav-brand" href="/"><span class="nav-logo">Doubt<span>It</span></span></a>
    <div class="nav-links" id="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/search.html">Check a Campaign</a>
    </div>
    <button class="nav-mobile-btn" id="nav-mobile-btn" aria-label="Toggle menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:1.5rem;font-weight:700;color:var(--text)">Admin Access</div>
      <div style="color:var(--text-muted);font-size:0.9rem;margin-top:4px">DoubtIt Review Dashboard</div>
    </div>
    <div class="card">
      <div class="card-body">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="form-group mb-0">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-alert" class="mt-16"></div>
          <button type="submit" class="btn btn-primary btn-block mt-16" id="login-btn">Sign In</button>
        </form>
      </div>
    </div>
    <p class="text-sm text-muted text-center mt-16">Admin access only. <a href="/">Return to public site</a></p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/admin/login.js"></script>
</body>
</html>
