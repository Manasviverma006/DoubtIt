<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check a Campaign – DoubtIt</title>
  <meta name="description" content="DoubtIt — Do not let your trust become a trap. Search for donation campaigns by name, UPI ID, website, phone or bank account. See risk scores and complaint history.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a class="nav-brand" href="/"><span class="nav-logo">Doubt<span>It</span></span></a>
    <div class="nav-links" id="nav-links">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/search.html">Check a Campaign</a>
      <a class="nav-link" href="/campaigns.html">Browse</a>
      <a class="nav-link" href="/ranking.html">Risk Ranking</a>
      <a class="nav-link" href="/about.html">About</a>
      <a class="nav-link cta" href="/submit.html">Submit a Campaign</a>
    </div>
    <button class="nav-mobile-btn" id="nav-mobile-btn" aria-label="Toggle menu">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1>Check a Campaign</h1>
    <p class="subtitle">Search by campaign name, UPI ID, website URL, bank account, phone number, or campaign ID.</p>
  </div>
</div>

<main class="page-content">
  <div class="container">

    <div class="card mb-24">
      <div class="card-body">
        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="#9C9690" stroke-width="1.5"/><path d="M12.5 12.5L16 16" stroke="#9C9690" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="search-input" class="search-input" type="text" placeholder="e.g. Aarogya Child Care, shared01@upi.test, campaign001.example.invalid…" autocomplete="off">
        </div>
        <div class="search-type-row">
          <span style="font-size:0.8125rem;color:var(--text-muted);font-weight:600;align-self:center">Search by:</span>
          <button class="search-type-btn active" data-type="all">All Fields</button>
          <button class="search-type-btn" data-type="name">Campaign Name</button>
          <button class="search-type-btn" data-type="id">Campaign ID</button>
          <button class="search-type-btn" data-type="upi">UPI ID</button>
          <button class="search-type-btn" data-type="bank">Bank Account</button>
          <button class="search-type-btn" data-type="phone">Phone</button>
          <button class="search-type-btn" data-type="website">Website</button>
        </div>
      </div>
    </div>

    <div id="search-state"></div>
    <div id="search-results"></div>

  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <div class="footer-brand"><span>Doubt</span>It. <span class="footer-tagline">— Do not let your trust become a trap.</span></div>
    <div class="footer-links"><a href="/about.html">About</a><a href="/submit.html">Submit Campaign</a></div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
